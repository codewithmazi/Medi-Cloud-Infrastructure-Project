name: Deploy CF Stack

on:
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v2
          with: 
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: us-east-1
        - name: List Files
          run: ls -R
          working-directory: ${{ github.workspace }}
        - name: Configure Database Credentials
          uses: aws-actions/aws-cloudformation-github-deploy@v1
          with: 
            name: MediEquipStack
            template: MediEquipStack.yaml
            parameter-overrides: "DBPassword=${{ secrets.DB_PASSWORD }}"
        - name: Deploy Web Server Stack
          run: |
            aws cloudformation deploy \
              --stack-name Webserver-asg \
              --template-file Webserver-asg.yaml \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameter-overrides \
              VpcId=$(aws cloudformation describe-stacks --stack-name MediEquipStack --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" --output text) \
              SubnetIds=$(aws cloudformation describe-stacks --stack-name MediEquipStack --query "Stacks[0].Outputs[?OutputKey=='PublicSubnetPubVPC' || OutputKey=='PublicSubnetPubVPC2' || OutputKey=='PublicSubnetPubVPC3'].OutputValue" --output text) \
              RDSEndpoint=$(aws cloudformation describe-stacks --stack-name MediEquipStack --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint' ].OutputValue" -- output text)
          working-directory: ${{ github.workspace }}